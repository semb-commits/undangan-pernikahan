<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Link Undangan</title>
<style>
body{font-family:Arial,sans-serif;padding:20px;background:#faf8f5}
h2{color:#7a1f2a}
textarea{width:100%;height:150px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
button{background:#7a1f2a;color:white;border:none;padding:12px 25px;border-radius:8px;margin-top:10px;cursor:pointer;font-size:16px;margin-right:8px}
.box{background:white;padding:15px;margin-top:15px;border-radius:8px;border:1px solid #ddd}
.link-item{margin:8px 0;word-break:break-all}
.link-item a{color:#7a1f2a;text-decoration:none}
.copy-btn{background:#c9a86a;padding:5px 10px;font-size:12px;margin-left:8px;border-radius:5px;border:none;cursor:pointer}
.action-btns{margin-top:15px}
.action-btns button{background:#4a4a4a}
.clear-btn{background:#b33 !important}
</style>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<h2>Generator Link Undangan</h2>
<p>Masukkan nama tamu, 1 baris 1 nama:</p>

<textarea id="namaList" placeholder="Budi Santoso
Siti Aminah
Pak Joko dan Keluarga"></textarea>

<button onclick="generate()">Buat/Tambah Link</button>
<button class="clear-btn" onclick="clearData()">Hapus Semua</button>

<div id="hasil"></div>

<script>
const baseLink = window.location.origin + window.location.pathname.replace('/generator.html', '/') + '?untuk=';
let guestList = JSON.parse(localStorage.getItem('guestList') || '[]');

// Load data pas halaman dibuka biar gak hilang pas refresh
window.onload = function(){
  if(guestList.length > 0) render();
}

function generate(){
  const newNames = document.getElementById('namaList').value.trim().split('\n');
  newNames.forEach(nama => {
    nama = nama.trim();
    if(nama !== '' && !guestList.includes(nama)){
      guestList.push(nama);
    }
  });
  
  localStorage.setItem('guestList', JSON.stringify(guestList));
  document.getElementById('namaList').value = '';
  render();
}

function render(){
  if(guestList.length === 0) {
    document.getElementById('hasil').innerHTML = '';
    return;
  }
  
  let html = `<div class="box"><h3>Link Undangan - Total ${guestList.length} tamu:</h3>`;
  
  guestList.forEach(nama => {
    const link = baseLink + encodeURIComponent(nama);
    html += `<div class="link-item">
      <strong>${nama}</strong><br>
      <a href="${link}" target="_blank">${link}</a>
      <button class="copy-btn" onclick="copyLink('${link}')">Copy</button>
    </div>`;
  });
  
  html += `<div class="action-btns">
    <button onclick="downloadExcel()">Download Semua Excel</button>
    <button onclick="downloadPDF()">Download Semua PDF</button>
  </div>`;
  
  html += '</div>';
  document.getElementById('hasil').innerHTML = html;
}

function copyLink(link){
  navigator.clipboard.writeText(link);
  alert('Link sudah dicopy!');
}

function downloadExcel(){
  const rows = guestList.map(nama => ({
    Nama: nama, 
    Link: baseLink + encodeURIComponent(nama)
  }));
  
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Tamu");
  XLSX.writeFile(wb, "daftar-tamu-undangan.xlsx");
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 15;
  
  doc.setFontSize(14);
  doc.text("Daftar Link Undangan", 10, y);
  y += 10;
  doc.setFontSize(9);
  
  guestList.forEach((nama, i) => {
    const link = baseLink + encodeURIComponent(nama);
    const text = `${i+1}. ${nama}: ${link}`;
    const lines = doc.splitTextToSize(text, 180);
    doc.text(lines, 10, y);
    y += lines.length * 5 + 3;
    
    if(y > 270){
      doc.addPage();
      y = 15;
    }
  });
  
  doc.save("daftar-tamu-undangan.pdf");
}

function clearData(){
  if(confirm('Yakin mau hapus semua data tamu?')){
    localStorage.removeItem('guestList');
    guestList = [];
    render();
  }
}
</script>

</body>
</html>
