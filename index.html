<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>risky & anindita - Undangan Pernikahan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --maroon:#7a1f2a;
  --cream:#faf8f5;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Montserrat',sans-serif;
  background:var(--cream);
  color:#333;
  padding-bottom:70px;
}

section{
  min-height:100vh;
  padding:40px 20px 80px;
  display:none;
  animation:fadeIn 0.5s;
}
section.active{display:block}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:var(--maroon);
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  z-index:100;
}
.nav-item{
  color:white;
  text-align:center;
  font-size:11px;
  cursor:pointer;
  opacity:0.6;
}
.nav-item.active{opacity:1;}

.prewedding-frame{
  width:100%;
  max-width:300px;
  margin:0 auto 30px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,0.12);
  border:6px solid white;
}
.prewedding-frame img{
  width:100%;
  height:auto;
  display:block;
}
</style>
</head>
<body>

<div id="main">

  <section id="rsvp" class="active">
    <div style="max-width:500px;margin:0 auto;text-align:center;padding:0 15px">

      <div class="prewedding-frame">
        <img id="prewedImg" alt="Risky & Anindita Prewedding">
      </div>

      <h2 style="font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--maroon);margin-bottom:25px">Konfirmasi Kehadiran</h2>

      <input type="text" id="namaTamu" placeholder="Nama Anda" readonly style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;background:#fff">
      <select id="kehadiran" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;background:#fff">
        <option value="">Konfirmasi Kehadiran</option>
        <option value="Hadir">Hadir</option>
        <option value="Tidak Hadir">Tidak Hadir</option>
      </select>
      <textarea id="pesan" rows="4" placeholder="Ucapan & Doa" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;font-family:inherit;background:#fff"></textarea>
      <button style="width:100%;background:var(--maroon);color:white;border:none;padding:15px;border-radius:8px;cursor:pointer;font-size:16px">Kirim ke WhatsApp</button>
    </div>
  </section>

</div>

<div class="bottom-nav">
  <div class="nav-item active">Wishes</div>
</div>

<script>
  // Auto cache busting - ganti src pakai timestamp biar gak kecache
  document.getElementById('prewedImg').src = 
    'https://semb-commits.github.io/undangan-pernikahan/preweding.jpeg?t=' + Date.now();
</script>

</body>
        </html>
