<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undangan Pernikahan</title>
<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial, sans-serif;
  background:#f9f7f5;
}

/* COVER */
#cover{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#f9f7f5;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:9999;
}
#cover.hide{
  display:none;
}

#cover h3{
  font-size:16px;
  letter-spacing:4px;
  color:#7a1f2a;
  margin-bottom:20px;
}
#cover h1{
  font-size:42px;
  color:#7a1f2a;
  margin:10px 0;
}
#cover p{
  font-size:14px;
  color:#666;
  margin:5px 0;
}
#cover button{
  margin-top:25px;
  background:#7a1f2a;
  color:white;
  border:none;
  padding:15px 40px;
  font-size:16px;
  border-radius:5px;
  cursor:pointer;
  /* ini kunci biar bisa di klik */
  position:relative;
  z-index:10000;
  pointer-events:auto !important;
}

/* MAIN */
#main{
  display:none;
  padding:40px 20px;
  text-align:center;
}
#main h2{
  color:#7a1f2a;
}
</style>
</head>
<body>

<!-- COVER -->
<div id="cover">
  <h3>THE WEDDING OF</h3>
  <h1>INTAN & JANU</h1>
  <p>Kepada Yth.</p>
  <p>Bapak/Ibu/Saudara/i</p>
  <p style="font-size:20px;font-weight:bold;margin-top:10px;">Tamu Undangan</p>
  <button id="openBtn">Buka Undangan</button>
</div>

<!-- MAIN CONTENT -->
<div id="main">
  <h2>Selamat Datang</h2>
  <p>Ini isi undangan nya</p>
  <p>Rabu, 10 Juni 2026</p>
  <p>Rumah Makan Laras Slogohimo</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var btn = document.getElementById('openBtn');
  var cover = document.getElementById('cover');
  var main = document.getElementById('main');
  
  btn.onclick = function(){
    cover.classList.add('hide');
    main.style.display = 'block';
  }
});
</script>

</body>
</html>
